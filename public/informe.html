<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informe ejecutivo · Feria de la Uva 2026</title>
<link rel="icon" href="/img/logo_sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--navy:#2a2672;--ink:#1f1d3d;--ink2:#55537a;--muted:#8a88a3;--line:#e7e5f3;--soft:#f3f1fb;--orange:#e0661f;--blue:#2a8fb3;--green:#5a9e32;--violet:#4a43b0;--grape:#9a5bd0;--good:#2e8540;--warn:#b7791f;--bad:#c0392b}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e9e7f3;font-family:Poppins,system-ui,sans-serif;color:var(--ink);font-size:12.5px;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
  .toolbar button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;background:#e0661f;color:#fff}
  .toolbar .ghost{background:rgba(255,255,255,.12)}
  .page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:16mm 16mm 18mm;box-shadow:0 10px 40px rgba(31,29,61,.12);position:relative;overflow:hidden}
  .page + .page{page-break-before:always}
  .cover{padding:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#2a2672 0%,#3b3592 55%,#4a43b0 100%);color:#fff}
  .cover .in{padding:22mm 18mm 0;flex:1;display:flex;flex-direction:column}
  .cover img{width:68mm;background:#fff;border-radius:22px;padding:10px;align-self:flex-start}
  .cover .kicker{margin-top:16mm;letter-spacing:.24em;text-transform:uppercase;font-size:11px;opacity:.75}
  .cover h1{font-family:Fraunces,Georgia,serif;font-size:44px;line-height:1.08;margin:8px 0 10px;color:#fff;font-weight:700}
  .cover .sub{font-size:16px;opacity:.88;max-width:150mm}
  .cover .meta{margin-top:auto;padding:12mm 0 14mm;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:11px}
  .cover .meta b{display:block;font-size:13px}
  .cover .bandas{height:10px;background:linear-gradient(90deg,#5cc6e2,#6ab43e,#f26b21,#ffd400)}
  .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;font-size:10.5px;color:var(--muted)}
  .ph img{height:26px}
  .pf{position:absolute;bottom:8mm;left:16mm;right:16mm;display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
  h2{font-family:Fraunces,Georgia,serif;font-size:24px;color:var(--navy);margin:0 0 4px;font-weight:700}
  h2 .n{color:var(--orange);margin-right:8px}
  .lead{color:var(--ink2);margin:0 0 14px;font-size:13px}
  h3{font-size:13.5px;margin:18px 0 8px;color:var(--ink)}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .k{border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden;background:#fff}
  .k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--a,var(--navy))}
  .k .l{font-size:10.5px;color:var(--ink2);font-weight:500}
  .k .v{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .k .s{font-size:10px;color:var(--muted)}
  .hero{display:grid;grid-template-columns:52mm 1fr;gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .gauge{position:relative;width:46mm;height:46mm;margin:auto}
  .gauge .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .gauge .t b{font-size:30px;line-height:1;color:var(--navy);display:block}
  .gauge .t span{font-size:10px;color:var(--ink2)}
  .verdict{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--navy);margin:0 0 6px;line-height:1.3}
  ul.f{margin:0;padding:0;list-style:none}
  ul.f li{padding:8px 0 8px 22px;border-bottom:1px dashed var(--line);position:relative}
  ul.f li::before{content:"";position:absolute;left:4px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--violet)}
  ul.r li::before{background:var(--orange);border-radius:2px;transform:rotate(45deg)}
  .chart{position:relative;height:62mm}
  .chart.sm{height:52mm}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{text-align:left;color:var(--ink2);font-weight:600;font-size:10px;padding:6px;border-bottom:1px solid var(--line)}
  td{padding:6px;border-bottom:1px solid var(--line)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--navy)}
  .tag.ok{background:#e6f4ea;color:var(--good)}.tag.warn{background:#fdf3e1;color:var(--warn)}.tag.bad{background:#fdecea;color:var(--bad)}
  .box{border:1px solid var(--line);border-radius:12px;padding:12px}
  .quote{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:11px}
  .quote b{color:var(--navy)}
  .bars .b{display:grid;grid-template-columns:30mm 1fr 18mm;gap:8px;align-items:center;margin:6px 0}
  .bars .tr{height:16px;background:var(--soft);border-radius:4px;overflow:hidden}
  .bars .tr i{display:block;height:100%;background:var(--c);border-radius:0 3px 3px 0}
  .bars b{text-align:right;font-variant-numeric:tabular-nums}
  .demo{background:#fff8db;border:1px solid #f3e08a;color:#6b5600;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:11px}
  .gloss dt{font-weight:600;margin-top:8px}.gloss dd{margin:0;color:var(--ink2)}
  .loading{text-align:center;padding:80px;color:var(--muted);font-size:16px}
  @page{size:A4;margin:0}
  @media print{body{background:#fff;font-size:11.5px;line-height:1.45}.page{padding:12mm 14mm 16mm}.chart.sm{height:44mm}ul.f li{padding:5px 0 5px 20px}ul.f li::before{top:11px}h3{margin:12px 0 6px}.lead{margin-bottom:10px}.toolbar{display:none}.page{margin:0;box-shadow:none;width:210mm;min-height:297mm}}
  @media screen and (max-width:820px){.page{width:auto;min-height:0;margin:10px;padding:18px}.cover .in{padding:24px}.cover h1{font-size:32px}.g4{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.pf{position:static;margin-top:20px}}
</style>
</head>
<body>
<div class="toolbar"><b>Informe ejecutivo de impacto</b><div><button class="ghost" onclick="history.length > 1 ? history.back() : close()">Volver</button> <button onclick="window.print()">Descargar PDF</button></div></div>
<div id="doc"><div class="loading">Preparando el informe…</div></div>
<script src="/informe.js"></script>
</body>
</html>
