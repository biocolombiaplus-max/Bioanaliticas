<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Informe ejecutivo · Sala de Prensa</title>
<link rel="icon" href="/img/logo_sm.png">
<meta name="theme-color" content="#2a2672">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sala de Prensa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<link rel="stylesheet" href="/hoja-carta.css">
<style>
  :root{--warn:#b7791f;--bad:#c0392b}
  .lead2{color:var(--ink2);margin:-3mm 0 5mm;font-size:11px}
  .lead2 a{color:var(--violet);word-break:break-all}
  .grid{display:grid;gap:4mm}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .k{border:1px solid var(--line);border-radius:14px;padding:4mm 4.5mm;position:relative;overflow:hidden;background:#fff;min-height:23mm}
  .k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a,var(--navy))}
  .k .l{font-size:8.5px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .k .v{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.01em;margin-top:1mm}
  .k .s{font-size:9px;color:var(--muted)}
  .pb .hero{display:grid;grid-template-columns:52mm 1fr;gap:6mm;align-items:center;background:var(--soft);border-radius:16px;padding:5mm 6mm;border-left:4px solid var(--orange)}
  .gauge{position:relative;width:44mm;height:44mm;margin:auto}
  .gauge .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .gauge .t b{font-size:30px;line-height:1;color:var(--navy);display:block}
  .gauge .t span{font-size:9px;color:var(--ink2)}
  .verdict{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--navy);margin:0 0 6px;line-height:1.3}
  .pb .hero p{font-size:11px}
  ul.f{margin:0;padding:0;list-style:none}
  ul.f li{padding:2.6mm 0 2.6mm 9mm;border-bottom:1px solid var(--line);position:relative;font-size:11px}
  ul.f li::before{content:"✓";position:absolute;left:0;top:2.6mm;width:5.5mm;height:5.5mm;border-radius:50%;background:#ecebfa;color:var(--violet);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1}
  ul.r li::before{content:"→";background:#fdeee4;color:var(--orange)}
  .box{border:1px solid var(--line);border-radius:14px;padding:4mm 4.5mm;display:flex;flex-direction:column}
  .box.ch{height:72mm}
  .box .cv{flex:1;min-height:0;position:relative}
  .box h3 small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:10.5px}
  th{text-align:left;color:var(--ink2);font-weight:600;font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;padding:2.2mm 2mm;border-bottom:2px solid var(--line);background:var(--soft)}
  td{padding:2.2mm 2mm;border-bottom:1px solid var(--line)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;min-width:8mm;text-align:center;border-radius:999px;padding:1px 7px;font-weight:700;color:#fff;background:var(--c)}
  .quote{background:var(--soft);border-radius:10px;padding:3mm 4mm;font-size:10.5px}
  .quote b{color:var(--navy)}
  .bars .b{display:grid;grid-template-columns:28mm 1fr 16mm;gap:8px;align-items:center;margin:3mm 0}
  .bars .tr{height:7mm;background:var(--soft);border-radius:6px;overflow:hidden}
  .bars .tr i{display:block;height:100%;background:var(--c);border-radius:0 6px 6px 0}
  .bars b{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
  .demo{background:#fff8db;border:1px solid #f3e08a;color:#6b5600;border-radius:10px;padding:3mm 4mm;font-size:10px}
  .gloss{display:grid;grid-template-columns:1fr 1fr;gap:3mm 6mm;margin:0}
  .gloss div{background:var(--soft);border-radius:10px;padding:3mm 4mm}
  .gloss dt{font-weight:700;color:var(--navy);font-size:10.5px}.gloss dd{margin:0;color:var(--ink2);font-size:9.5px}
  .fuente{font-size:8.5px;color:var(--muted);margin-top:5mm}
</style>
</head>
<body>
<div class="toolbar"><b>Informe ejecutivo de impacto</b><div class="grp"><button onclick="history.length > 1 ? history.back() : close()">← Volver</button><button onclick="window.print()">🖨 Imprimir</button><button class="hot" id="b-pdf">⬇ Descargar PDF</button></div></div>
<div class="aviso" id="aviso" style="display:none"></div>
<div id="doc"><div class="loading">Preparando el informe…</div></div>
<script src="/hoja-carta.js"></script>
<script src="/informe.js"></script>
</body>
</html>
