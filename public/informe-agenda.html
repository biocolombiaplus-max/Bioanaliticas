<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Informe de gestión · Oficina de Prensa</title>
<link rel="icon" href="/img/logo_sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--navy:#2a2672;--ink:#1f1d3d;--ink2:#55537a;--muted:#8a88a3;--line:#e7e5f3;--soft:#f3f1fb;--orange:#e0661f;--blue:#2a8fb3;--green:#5a9e32;--violet:#4a43b0;--grape:#9a5bd0;--good:#2e8540}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#e9e7f3;font-family:Poppins,system-ui,sans-serif;color:var(--ink);font-size:12px;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
  .toolbar .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar button,.toolbar label{font:inherit;font-weight:600;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;gap:6px;align-items:center}
  .toolbar .hot{background:var(--orange)}
  .toolbar .on{background:#fff;color:var(--navy)}
  .aviso{background:#fff8db;color:#6b5600;text-align:center;padding:8px;font-size:12px}
  .page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:14mm 15mm 18mm;box-shadow:0 10px 40px rgba(31,29,61,.12);position:relative}
  .page + .page{page-break-before:always}
  .cover{padding:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#1b1850 0%,#2a2672 55%,#4a43b0 100%);color:#fff}
  .cover .in{padding:24mm 18mm 0;flex:1;display:flex;flex-direction:column}
  .cover img{width:58mm;background:#fff;border-radius:20px;padding:10px;align-self:flex-start}
  .cover .kick{margin-top:18mm;letter-spacing:.24em;text-transform:uppercase;font-size:11px;opacity:.75}
  .cover h1{font-family:Fraunces,Georgia,serif;font-size:44px;line-height:1.05;margin:8px 0 10px}
  .cover .sub{font-size:17px;opacity:.9}
  .cover .meta{margin-top:auto;padding:12mm 0 14mm;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:11px}
  .cover .meta b{display:block;font-size:13px}
  .bandas{height:10px;background:linear-gradient(90deg,#5cc6e2,#6ab43e,#f26b21,#ffd400)}
  .ph{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;font-size:10px;color:var(--muted)}
  .ph img{height:24px}
  h2{font-family:Fraunces,Georgia,serif;font-size:24px;color:var(--navy);margin:0 0 6px}
  h2 .n{color:var(--orange);margin-right:8px}
  h3{font-size:13.5px;margin:16px 0 8px}
  .grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
  .k{border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
  .k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--a,var(--navy))}
  .k .l{font-size:10.5px;color:var(--ink2)} .k .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums} .k .s{font-size:10px;color:var(--muted)}
  .lead{font-size:13px;color:var(--ink);white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:14px 16px;margin:12px 0}
  ul.f{margin:0;padding:0;list-style:none}
  ul.f li{padding:7px 0 7px 22px;border-bottom:1px dashed var(--line);position:relative}
  ul.f li::before{content:"";position:absolute;left:4px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  ul.r li::before{background:var(--orange);border-radius:2px;transform:rotate(45deg)}
  .chart{position:relative;height:58mm}
  .box{border:1px solid var(--line);border-radius:12px;padding:12px}
  .act{border:1px solid var(--line);border-left:4px solid var(--c,var(--violet));border-radius:10px;padding:10px 12px;margin-bottom:8px;page-break-inside:avoid;break-inside:avoid}
  .act.realizada{--c:var(--good)}.act.cancelada{--c:#b9b7cf}.act.reprogramada{--c:#b7791f}
  .act .t{display:flex;justify-content:space-between;gap:10px}
  .act .t b{font-size:12.5px}
  .tag{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--navy);white-space:nowrap}
  .tag.ok{background:#e6f4ea;color:var(--good)}
  .act .m{font-size:10.5px;color:var(--ink2)}
  .act .r{margin-top:4px}
  .act .ph4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .act .ph4 img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
  .act a{color:var(--violet);word-break:break-all;font-size:10px}
  .dia{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);margin:14px 0 6px}
  .firma{margin-top:30mm;display:grid;grid-template-columns:1fr 1fr;gap:20mm}
  .firma div{border-top:1px solid var(--ink);padding-top:6px;font-size:11px}
  [contenteditable="true"]{outline:2px dashed #f0b27a;outline-offset:3px;border-radius:6px;background:#fffaf4}
  .pf{position:absolute;bottom:8mm;left:15mm;right:15mm;display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
  .loading{text-align:center;padding:80px;color:var(--muted);font-size:16px}
  .opts{display:none}
  @page{size:A4;margin:0}
  @media print{body{background:#fff;font-size:11.5px}.toolbar,.aviso{display:none}.page{margin:0;box-shadow:none;min-height:297mm}[contenteditable]{outline:0;background:none}}
  @media screen and (max-width:820px){.page{width:auto;min-height:0;margin:10px;padding:18px}.cover .in{padding:24px}.cover h1{font-size:32px}.g3{grid-template-columns:1fr 1fr}.pf{position:static;margin-top:16px}.act .ph4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="toolbar">
  <b>Informe de gestión</b>
  <div class="grp">
    <label><input type="checkbox" id="o-fotos" checked> Fotos</label>
    <label><input type="checkbox" id="o-canceladas"> Canceladas</label>
    <button id="b-ia" style="display:none">✦ Redactar con IA</button>
    <button id="b-editar">✎ Editar textos</button>
    <button class="hot" onclick="window.print()">Descargar PDF</button>
  </div>
</div>
<div class="aviso" id="aviso" style="display:none"></div>
<div id="doc"><div class="loading">Preparando el informe…</div></div>
<script src="/informe-agenda.js"></script>
</body>
</html>
