<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Informe de gestión · Oficina de Prensa</title>
<link rel="icon" href="/img/logo_sm.png">
<meta name="theme-color" content="#2a2672">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sala de Prensa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<link rel="stylesheet" href="/hoja-carta.css">
<style>
  /* Tablero */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  .k{border:1px solid var(--line);border-radius:14px;padding:4mm 4.5mm;display:flex;gap:3.5mm;align-items:center;background:#fff;height:24mm}
  .k .ic{width:11mm;height:11mm;border-radius:12px;display:grid;place-items:center;background:var(--bg);flex:none}
  .k .ic svg{width:6mm;height:6mm}
  .k .l{font-size:8.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .k .v{font-size:25px;font-weight:700;line-height:1.1;color:var(--ink)}
  .k .s{font-size:9px;color:var(--muted)}
  .row2{display:grid;grid-template-columns:62mm 1fr;gap:4mm;margin-top:4mm}
  .box{border:1px solid var(--line);border-radius:14px;padding:4mm 4.5mm;background:#fff}
  .gauge{height:64mm;display:flex;flex-direction:column}
  .gauge .cv{flex:1;min-height:0;position:relative}
  .ley{display:flex;justify-content:space-between;font-size:9px;color:var(--ink2);margin-top:2mm}
  .ley i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle}
  .lead{font-size:11.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;background:var(--soft);border-radius:14px;padding:5mm 6mm;margin:0;border-left:4px solid var(--orange)}
  .row2 .lead{height:64mm;overflow:hidden}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:4mm}
  .charts .box{height:80mm;display:flex;flex-direction:column}
  .charts .cv{flex:1;min-height:0;position:relative}

  /* Listas */
  ul.f{margin:0;padding:0;list-style:none}
  ul.f li{padding:3mm 0 3mm 9mm;border-bottom:1px solid var(--line);position:relative;font-size:11.5px}
  ul.f li::before{content:"✓";position:absolute;left:0;top:3mm;width:5.5mm;height:5.5mm;border-radius:50%;background:#e6f4ea;color:var(--good);font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1}
  ul.r li::before{content:"→";background:#fdeee4;color:var(--orange)}
  .sub3{margin-top:7mm}

  /* Bitácora */
  .dia{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--navy);margin:2mm 0 3mm}
  .dia::after{content:"";flex:1;height:1px;background:var(--line)}
  .dia span{background:var(--soft);border-radius:999px;padding:3px 10px}
  .act{border:1px solid var(--line);border-radius:14px;padding:4mm 5mm;margin-bottom:3.5mm;position:relative;overflow:hidden}
  .act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--violet))}
  .act.realizada{--c:var(--good)}.act.cancelada{--c:#b9b7cf}.act.reprogramada{--c:#b7791f}
  .act .t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .act .t b{font-size:13.5px;line-height:1.3}
  .act .hr{color:var(--orange);font-weight:700;font-size:10px;letter-spacing:.04em}
  .tag{display:inline-block;font-size:8.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--navy);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
  .tag.ok{background:#e6f4ea;color:var(--good)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:2.5mm}
  .chip{font-size:9.5px;color:var(--ink2);background:var(--soft);border-radius:6px;padding:2px 8px}
  .act .r{margin-top:2.5mm;font-size:11px}
  .act .m{font-size:10px;color:var(--ink2);margin-top:2mm}
  .nums{display:flex;gap:4mm;margin-top:2.5mm}
  .nums div{font-size:9px;color:var(--muted)}
  .nums b{display:block;font-size:15px;color:var(--ink);line-height:1.1}
  .fotos{display:grid;gap:2.5mm;margin-top:3.5mm}
  .ft{background-color:var(--soft);background-size:cover;background-position:center;border-radius:10px;position:relative;overflow:hidden}
  .ft em{position:absolute;left:0;right:0;bottom:0;padding:5px 9px;font-style:normal;font-size:9px;color:#fff;background:rgba(20,18,60,.62)}
  .act.cf{display:grid;grid-template-columns:minmax(0,1fr) 86mm;gap:5mm;align-items:start}
  .act.cf .fotos{margin-top:0}
  .f1{grid-template-columns:1fr}.f1 .ft{height:58mm}
  .f2{grid-template-columns:1fr 1fr}.f2 .ft{height:58mm}
  .f3{grid-template-columns:2fr 1fr;grid-template-rows:28mm 28mm}.f3 .ft:first-child{grid-row:span 2}
  .f4{grid-template-columns:1fr 1fr;grid-template-rows:28mm 28mm}
  .compacto .f1 .ft,.compacto .f2 .ft{height:40mm}.compacto .f3,.compacto .f4{grid-template-rows:19mm 19mm}.act.compacto{padding:3.5mm 4.5mm}.act.compacto .chips,.act.compacto .links{display:none}
  .links{margin-top:2.5mm;font-size:9.5px}
  .links a{color:var(--violet);word-break:break-all}

  /* Equipo y cierre */
  .eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin-bottom:3mm}
  .eqc{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3.5mm}
  .eqc .m{font-size:9.5px;color:var(--ink2)}
  .av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:13px;flex:none}
  .cierre{margin-top:6mm}
  .firma{margin-top:12mm;display:grid;grid-template-columns:1fr 1fr;gap:18mm;font-size:10.5px}
  .firma .linea{border-top:1.5px solid var(--ink);margin:2px 0 6px}
  .firma-box{height:26mm;display:flex;align-items:flex-end;justify-content:center}
  .firma-img{display:block;max-width:62mm;max-height:26mm;margin-bottom:-3mm;object-fit:contain}
  .fuente{font-size:8.5px;color:var(--muted);margin-top:10mm}

  .panel{position:fixed;inset:0;background:rgba(27,24,80,.5);display:grid;place-items:center;z-index:20;padding:16px}
  .panel[hidden]{display:none}
  .panel-card{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;font-size:14px}
  .panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .panel-h button{border:0;background:#f3f1fb;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
  .pick{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .pick input{width:20px;height:20px}
  .pick small{color:var(--muted)}
  .panel-acc{margin-top:14px;text-align:right}
  .panel-acc .ok{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 20px;background:var(--orange);color:#fff;cursor:pointer}
  [contenteditable="true"]{outline:2px dashed #f0b27a;outline-offset:3px;border-radius:6px;background:#fffaf4}
  .loading{text-align:center;padding:80px;color:var(--muted);font-size:16px}
</style>
</head>
<body>
<div class="toolbar">
  <b>Informe de gestión</b>
  <div class="grp">
    <label><input type="checkbox" id="o-fotos" checked> Fotos</label>
    <label><input type="checkbox" id="o-canceladas"> Canceladas</label>
    <button id="b-equipo">👥 Equipo</button>
    <label><input type="checkbox" id="o-firma" checked> Firma</label>
    <a id="b-firma" href="/app.html#firma">✍ Mi firma</a>
    <button id="b-ia" style="display:none">✦ Redactar con IA</button>
    <button id="b-editar">✎ Editar textos</button>
    <button id="b-imprimir" onclick="window.print()">🖨 Imprimir</button>
    <button class="hot" id="b-pdf">⬇ Descargar PDF</button>
  </div>
</div>
<div class="aviso" id="aviso" style="display:none"></div>
<div id="doc"><div class="loading">Preparando el informe…</div></div>
<div id="panel" class="panel" hidden></div>
<div id="velo" class="velo" hidden></div>
<script src="/hoja-carta.js"></script>
<script src="/informe-agenda.js"></script>
</body>
</html>
